<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="Animated Pong game: Mariam vs Bugs" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b33"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="796" height="256" rx="16" fill="url(#bg)" stroke="#0891b2" stroke-width="3"/>
  <line x1="400" y1="14" x2="400" y2="246" stroke="#30363d" stroke-width="3" stroke-dasharray="10 10"/>

  <text x="400" y="42" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#e6edf3">MARIAM  7 : 0  BUGS</text>
  <text x="400" y="244" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">always winning against bugs</text>

  <!-- left paddle (Mariam) -->
  <rect x="22" width="12" height="70" rx="6" fill="#0891b2" filter="url(#glow)">
    <animate attributeName="y" dur="8s" repeatCount="indefinite" values="95;45;95;145;95" keyTimes="0;0.25;0.5;0.75;1"/>
  </rect>

  <!-- right paddle (Bugs) -->
  <rect x="766" width="12" height="70" rx="6" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="y" dur="8s" repeatCount="indefinite" values="145;95;55;95;145" keyTimes="0;0.25;0.5;0.75;1"/>
  </rect>

  <!-- ball -->
  <circle r="8" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="46;754;46;754;46" keyTimes="0;0.25;0.5;0.75;1"/>
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="130;240;130;20;130;240;130;20;130" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
